# pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --maxfail=1
    -p no:warnings

markers =
    slow: marks tests as slow
    auth: tests that require authentication
    api: tests for API endpoints