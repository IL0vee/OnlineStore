{% extends "base.html" %}

{% block title %}Вход - Магазин{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Вход в систему</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('main.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>Войти
                    </button>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-0">Нет аккаунта? <a href="{{ url_for('main.register') }}">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
        
        <!-- Тестовые данные -->
        <div class="card mt-3 bg-light">
            <div class="card-body">
                <h6 class="card-title"><i class="fas fa-info-circle me-1"></i>Тестовые данные:</h6>
                <p class="card-text small mb-0">
                    <strong>Администратор:</strong> admin / admin123<br>
                    <strong>Пользователь:</strong> user1 / user123
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
